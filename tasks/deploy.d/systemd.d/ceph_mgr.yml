---
- name: "ceph_common | Deploy ceph-mgr service configuration"
  ansible.builtin.template:
    src: "ceph_mgr_service.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ceph_common_systemd_dir') +
      '/ceph-mgr@.service.d/override.conf' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Daemon reload"
  when:
    - "(lookup('ansible.builtin.vars',
      'ceph_common_systemd')['mgr'] | default('')) not in ['', [], '[]', None]"
